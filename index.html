<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>20/10 — 11A4</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#000;}
  body{
    background:radial-gradient(circle at 50% 38%, #ffd9e8 0%, #ffb6d3 42%, #ff8fbb 72%, #f26ba0 100%);
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }

  /* ---------- LỚP SƯƠNG ---------- */
  #fog{
    position:fixed;inset:0;z-index:50;
    cursor:crosshair;
    touch-action:none;
    transition:opacity .9s ease;
  }
  #fog.gone{opacity:0;pointer-events:none;}

  /* ---------- ĐƯỜNG CHỈ DẪN ---------- */
  #guide{
    position:fixed;inset:0;z-index:55;
    width:100vw;height:100vh;
    pointer-events:none;
    opacity:0;
    transition:opacity .7s ease;
  }
  #guide.on{opacity:1;}
  #guide.fade{opacity:0;}

  #guideBase{
    stroke-dasharray:16 24;
    animation:breathe 3s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{stroke:rgba(255,255,255,.52);}
    50%{stroke:rgba(255,255,255,.88);}
  }

  #guideTrace{transition:opacity .5s ease;}
  #guideDot{transition:opacity .4s ease;}

  /* ---------- HINT ---------- */
  #hint{
    position:fixed;z-index:60;left:50%;bottom:8%;
    transform:translateX(-50%);
    text-align:center;
    color:#c2457f;
    font-size:14px;letter-spacing:.5px;
    pointer-events:none;
    transition:opacity .5s ease;
    text-shadow:0 1px 0 rgba(255,255,255,.8);
    width:max-content;
    max-width:96vw;
  }
  #hint .big{
    display:block;font-size:19px;font-weight:700;
    margin-bottom:8px;color:#b03a72;
    white-space:nowrap;
  }
  #hint .sub{
    display:block;
    white-space:nowrap;
  }
  #hint .finger{
    display:block;margin:14px auto 0;font-size:26px;
    animation:swipe 2.2s ease-in-out infinite;
  }
  @keyframes swipe{
    0%,100%{transform:translateX(-26px) rotate(-8deg);opacity:.5;}
    50%{transform:translateX(26px) rotate(8deg);opacity:1;}
  }
  #hint.hide{opacity:0;}

  /* ---------- SÂN KHẤU ---------- */
  #stage{
    position:fixed;inset:0;z-index:20;
    opacity:0;transition:opacity .8s ease;
    pointer-events:none;
  }
  #stage.on{opacity:1;}

  #heartField{position:absolute;inset:0;z-index:1;}

  .heart{
    position:absolute;
    will-change:transform,opacity;
    transform-origin:50% 50%;
  }
  .heart svg{display:block;width:100%;height:100%;}
  .heart svg path{filter:drop-shadow(0 2px 6px rgba(190,40,110,.35));}

  /* ---------- VÒNG ẢNH ---------- */
  #photoRing{
    position:absolute;
    top:50%;left:50%;
    width:0;height:0;
    transform-origin:0 0;
    z-index:5;
    will-change:transform;
  }

  .photo-slot{
    position:absolute;
    top:0;left:0;
    width:0;height:0;
    will-change:transform;
  }

  .photo{
    position:absolute;
    top:0;left:0;
    width:clamp(160px, 45vw, 230px);
    padding:9px 9px 32px;
    background:#fff;
    border-radius:2px;
    box-shadow:
      0 22px 44px -10px rgba(120,20,70,.38),
      0 6px 14px rgba(120,20,70,.18);
    transform-origin:50% 50%;
    transform:translate(-50%,-50%);
    will-change:transform,opacity;
    pointer-events:none;
  }
  .photo img{
    display:block;
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:1px;
    background:#f4e2ec;
  }

  /* ---------- THIỆP ---------- */
  #greeting{
    position:absolute;inset:0;
    z-index:30;
    display:flex;align-items:center;justify-content:center;
    padding:0 20px;
    opacity:0;
    transform:translateY(30px) scale(.94);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.8,.3,1);
  }
  #greeting.on{opacity:1;transform:translateY(0) scale(1);}

  .note{
    position:relative;
    width:min(88vw, 540px);
    padding:44px 34px 40px;
    background:linear-gradient(180deg, #fffdfa 0%, #fff6fa 100%);
    border-radius:6px;
    transform:rotate(-1.4deg);
    box-shadow:
      0 2px 0 rgba(255,255,255,.9) inset,
      0 18px 46px rgba(150,25,80,.32),
      0 4px 12px rgba(150,25,80,.16);
    text-align:center;
    z-index:15;
  }

  .note::before{
    content:'';
    position:absolute;inset:0;
    border-radius:6px;
    background:repeating-linear-gradient(
      180deg,
      transparent 0px,
      transparent 37px,
      rgba(255,150,195,.22) 37px,
      rgba(255,150,195,.22) 38px
    );
    pointer-events:none;
  }

  /* BÓ HOA GÓC DƯỚI PHẢI THIỆP */
  .bouquet{
    position:absolute;
    bottom:-210px; 
    right:-250px; 
    width: clamp(280px, 65vw, 420px);
    height: auto;
    z-index:16;
    
    mix-blend-mode: multiply;
    
    transform-origin: bottom right;
    animation:floatBouquet 4s ease-in-out infinite;
    pointer-events:none;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .bouquet.show{ opacity: 1; }
  
  @keyframes floatBouquet {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(1.5deg); }
  }

  .tape{
    position:absolute;
    width:104px;height:30px;
    background:rgba(255,182,213,.62);
    border-left:1px dashed rgba(255,255,255,.75);
    border-right:1px dashed rgba(255,255,255,.75);
    box-shadow:0 2px 6px rgba(160,40,100,.16);
    z-index:20;
  }
  .tape.tl{top:-13px;left:20px;transform:rotate(-7deg);}
  .tape.tr{top:-13px;right:20px;transform:rotate(6deg);}

  .note .day{
    position:relative;
    font-size:12px;letter-spacing:8px;text-indent:8px;
    font-weight:800;color:#d6437f;
    margin-bottom:20px;
  }

  .note .line1,
  .note .line2{
    position:relative;
    font-weight:800;
    line-height:1.45;
    text-shadow:0 1px 0 rgba(255,255,255,.9);
  }
  .note .line1{
    font-size:clamp(19px, 3.6vw, 26px);
    color:#a82663;
    margin-bottom:6px;
  }
  .note .line2{
    font-size:clamp(22px, 4.4vw, 32px);
    color:#e02f74;
    margin-bottom:24px;
  }

  .note .body{
    position:relative;
    font-size:clamp(13.5px, 2.2vw, 16px);
    line-height:2.05;
    color:#7d2450;
    font-weight:500;
    font-style:italic;
    padding-left: 20px;
    padding-right: 20px;
  }

  .note .sign{
    position:relative;
    margin-top:26px;
    font-size:clamp(14px, 2.4vw, 17px);
    font-weight:800;
    color:#b02866;
    letter-spacing:.4px;
  }
  .note .sign .heartmark{
    display:block;
    margin-top:12px;
    font-size:24px;color:#ff3d7f;
    font-style:normal;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);opacity:.82;}
    50%{transform:scale(1.24);opacity:1;}
  }

  /* ---------- MƯA TIM ---------- */
  #rain{
    position:fixed;inset:0;z-index:15;
    pointer-events:none;
  }

  @media (max-width:420px){
    .note{padding:34px 22px 30px;}
    .tape{width:78px;height:24px;}
    #hint .big{font-size:17px;}
    #hint .sub{font-size:13px;}
    .bouquet{
      width: 260px;
      bottom: -140px;
      right: -160px;
    }
    .note .body{padding-left: 10px;}
  }
</style>
</head>
<body>

<canvas id="rain"></canvas>

<div id="stage">
  <div id="heartField"></div>

  <div id="photoRing"></div>

  <div id="greeting">
    <div class="note">
      <div class="tape tl"></div>
      <div class="tape tr"></div>

      <!-- BÓ HOA -->
      <img src="bouquet.png" class="bouquet" id="bouquet" alt="Bó hoa">

      <div class="day">20 · 10</div>

      <div class="line1">Tập thể các bạn nam 11A4</div>
      <div class="line2">chúc các bạn nữ 11A4</div>

      <div class="body" id="dynamicGreeting">
        một ngày 20/10 thật rạng rỡ —<br>
        luôn xinh, luôn vui, luôn được yêu thương.
      </div>

      <div class="sign">
        — 11A4 —
        <span class="heartmark">♥</span>
      </div>
    </div>
  </div>
</div>

<!-- ĐƯỜNG DẪN VẼ TIM -->
<svg id="guide" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="gGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="gGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffb6d3"/>
      <stop offset="45%" stop-color="#ff2d75"/>
      <stop offset="100%" stop-color="#ff5c96"/>
    </linearGradient>
  </defs>

  <path id="guideBase"
        d="M500 850
           C300 700 150 560 150 380
           C150 240 260 140 390 140
           C450 140 490 180 500 240
           C510 180 550 140 610 140
           C740 140 850 240 850 380
           C850 560 700 700 500 850 Z"
        fill="none"
        stroke="rgba(255,255,255,.6)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path id="guideTrace"
        d="M500 850
           C300 700 150 560 150 380
           C150 240 260 140 390 140
           C450 140 490 180 500 240
           C510 180 550 140 610 140
           C740 140 850 240 850 380
           C850 560 700 700 500 850 Z"
        fill="none"
        stroke="url(#gGrad)"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#gGlow)"/>

  <circle id="guideDot" r="20" fill="#fff" filter="url(#gGlow)"/>
</svg>

<canvas id="fog"></canvas>

<div id="hint">
  <span class="big">Vẽ theo đường viền trái tim</span>
  <span class="sub">Dùng chuột hoặc ngón tay vẽ theo nét đứt</span>
  <span class="finger">♥</span>
</div>

<script>
(() => {
  'use strict';

  const GREETINGS = [
    "một ngày 20/10 thật rạng rỡ —<br>luôn xinh, luôn vui, luôn được yêu thương.",
    "chúc bạn ngày càng xinh đẹp, học giỏi,<br>và luôn là chính mình.",
    "mong bạn luôn mỉm cười thật tươi,<br>vì nụ cười của bạn rất đẹp.",
    "chúc bạn một ngày 20/10 ngập tràn<br>niềm vui và những điều bất ngờ.",
    "gửi bạn chút ấm áp mùa thu —<br>chúc bạn luôn bình an và hạnh phúc."
  ];

  const PHOTOS = ['1.jpg','2.jpg','3.jpg','4.jpg','5.jpg'];
  const PHOTO_DELAY = 1500;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const fog    = document.getElementById('fog');
  const fctx   = fog.getContext('2d');
  const rain   = document.getElementById('rain');
  const rctx   = rain.getContext('2d');
  const stage  = document.getElementById('stage');
  const field  = document.getElementById('heartField');
  const photoRing = document.getElementById('photoRing');
  const greet  = document.getElementById('greeting');
  const hint   = document.getElementById('hint');
  const greetingText = document.getElementById('dynamicGreeting');

  const guideSvg   = document.getElementById('guide');
  const guideTrace = document.getElementById('guideTrace');
  const guideDot   = document.getElementById('guideDot');

  let W = 0, H = 0;
  let revealed = false;

  async function initGreeting() {
    let ip = '';
    try {
      const res = await fetch('https://api.ipify.org?format=json');
      const data = await res.json();
      ip = data.ip || '';
    } catch (e) {
      ip = 'fallback-' + Math.random().toString();
    }

    let hash = 0;
    for (let i = 0; i < ip.length; i++) {
      hash = ((hash << 5) - hash) + ip.charCodeAt(i);
      hash |= 0;
    }

    const index = Math.abs(hash) % GREETINGS.length;
    greetingText.innerHTML = GREETINGS[index];
  }

  initGreeting();

  /* ============================================================
     ĐƯỜNG DẪN VẼ TIM
     ============================================================ */
  const PATH_LEN  = guideTrace.getTotalLength();
  const DRAW_MS   = 3200;
  const PAUSE_MS  = 900;

  guideTrace.style.strokeDasharray  = PATH_LEN;
  guideTrace.style.strokeDashoffset = PATH_LEN;
  guideDot.style.opacity = 0;

  let guideActive = true;
  let guideStart  = performance.now();
  let guideRaf    = null;

  const easeInOut = t => t < 0.5
    ? 2 * t * t
    : 1 - Math.pow(-2 * t + 2, 2) / 2;

  function guideTick(now){
    if (!guideActive) return;
    const total = DRAW_MS + PAUSE_MS;
    const t = (now - guideStart) % total;
    let drawT, fade;
    if (t < DRAW_MS){ drawT = t / DRAW_MS; fade = 1; }
    else { drawT = 1; fade = 1 - (t - DRAW_MS) / PAUSE_MS; }

    const eased = easeInOut(drawT);
    const len   = eased * PATH_LEN;
    guideTrace.style.strokeDashoffset = PATH_LEN - len;
    guideTrace.style.opacity = fade;

    const pt = guideTrace.getPointAtLength(len);
    guideDot.setAttribute('cx', pt.x);
    guideDot.setAttribute('cy', pt.y);
    guideDot.style.opacity = fade;

    guideRaf = requestAnimationFrame(guideTick);
  }

  function startGuide(){
    guideSvg.classList.add('on');
    guideStart = performance.now();
    guideRaf = requestAnimationFrame(guideTick);
    requestAnimationFrame(() => {
      requestAnimationFrame(buildGuideSamples);
    });
  }

  function stopGuideAnimation(){
    guideActive = false;
    if (guideRaf) cancelAnimationFrame(guideRaf);
    guideTrace.style.opacity = 0;
    guideDot.style.opacity   = 0;
  }

  function hideGuide(){
    guideSvg.classList.add('fade');
    setTimeout(() => { guideSvg.style.display = 'none'; }, 800);
  }

  /* ============================================================
     MẪU ĐIỂM TRÊN ĐƯỜNG TIM
     ============================================================ */
  const GUIDE_SAMPLES = [];
  const COVER_THRESHOLD = 0.82;
  let samplesReady = false;

  function buildGuideSamples(){
    GUIDE_SAMPLES.length = 0;
    samplesReady = false;

    const ctm = guideTrace.getScreenCTM();
    if (!ctm) { setTimeout(buildGuideSamples, 100); return; }

    const NUM = 120;
    for (let i = 0; i < NUM; i++){
      const pt = guideTrace.getPointAtLength((i / NUM) * PATH_LEN);
      const sp = pt.matrixTransform(ctm);
      GUIDE_SAMPLES.push({ x: sp.x, y: sp.y, covered: false });
    }

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const s of GUIDE_SAMPLES){
      if (s.x < minX) minX = s.x;
      if (s.x > maxX) maxX = s.x;
      if (s.y < minY) minY = s.y;
      if (s.y > maxY) maxY = s.y;
    }
    const bw = maxX - minX;
    const bh = maxY - minY;
    if (bw < W * 0.25 || bh < H * 0.25){
      setTimeout(buildGuideSamples, 100);
      return;
    }
    samplesReady = true;
  }

  function markCovered(x, y, r){
    if (!samplesReady) return;
    const rr = r * r;
    for (let i = 0; i < GUIDE_SAMPLES.length; i++){
      const s = GUIDE_SAMPLES[i];
      if (s.covered) continue;
      const dx = s.x - x, dy = s.y - y;
      if (dx * dx + dy * dy <= rr) s.covered = true;
    }
  }

  function checkCoverage(){
    if (revealed || !samplesReady) return;
    let c = 0;
    for (let i = 0; i < GUIDE_SAMPLES.length; i++){
      if (GUIDE_SAMPLES[i].covered) c++;
    }
    if (c / GUIDE_SAMPLES.length >= COVER_THRESHOLD) reveal();
  }

  /* ============================================================
     LỚP SƯƠNG
     ============================================================ */
  const BRUSH = 46;

  function paintFog(){
    fctx.globalCompositeOperation = 'source-over';
    fctx.clearRect(0, 0, W, H);

    const g = fctx.createLinearGradient(0, 0, W * 0.6, H);
    g.addColorStop(0.00, '#fff2f8');
    g.addColorStop(0.45, '#ffe6f1');
    g.addColorStop(1.00, '#ffd3e6');
    fctx.fillStyle = g;
    fctx.fillRect(0, 0, W, H);

    for (let i = 0; i < 170; i++){
      const x = Math.random() * W, y = Math.random() * H;
      const r = 50 + Math.random() * 190;
      const rg = fctx.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, `rgba(255,255,255,${0.035 + Math.random() * 0.09})`);
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      fctx.fillStyle = rg;
      fctx.beginPath(); fctx.arc(x, y, r, 0, 6.2832); fctx.fill();
    }

    for (let i = 0; i < 90; i++){
      const x = Math.random() * W, y = Math.random() * H;
      const r = 70 + Math.random() * 230;
      const rg = fctx.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, `rgba(255,160,205,${0.02 + Math.random() * 0.055})`);
      rg.addColorStop(1, 'rgba(255,160,205,0)');
      fctx.fillStyle = rg;
      fctx.beginPath(); fctx.arc(x, y, r, 0, 6.2832); fctx.fill();
    }

    for (let i = 0; i < 260; i++){
      const x = Math.random() * W, y = Math.random() * H;
      const r = 0.6 + Math.random() * 1.7;
      fctx.fillStyle = `rgba(255,255,255,${0.25 + Math.random() * 0.5})`;
      fctx.beginPath(); fctx.arc(x, y, r, 0, 6.2832); fctx.fill();
    }
  }

  function erase(x, y){
    if (revealed) return;
    fctx.globalCompositeOperation = 'destination-out';
    const rg = fctx.createRadialGradient(x, y, 0, x, y, BRUSH);
    rg.addColorStop(0.00, 'rgba(0,0,0,1)');
    rg.addColorStop(0.55, 'rgba(0,0,0,0.92)');
    rg.addColorStop(1.00, 'rgba(0,0,0,0)');
    fctx.fillStyle = rg;
    fctx.beginPath();
    fctx.arc(x, y, BRUSH, 0, 6.2832);
    fctx.fill();
    markCovered(x, y, BRUSH * 0.75);
  }

  function eraseLine(x0, y0, x1, y1){
    const d = Math.hypot(x1 - x0, y1 - y0);
    const steps = Math.max(1, Math.ceil(d / (BRUSH * 0.28)));
    for (let i = 1; i <= steps; i++){
      const t = i / steps;
      erase(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t);
    }
    checkCoverage();
  }

  let drawing = false, lastX = 0, lastY = 0, touched = false;

  window.addEventListener('pointerdown', e => {
    if (revealed) return;
    drawing = true;
    lastX = e.clientX; lastY = e.clientY;
    erase(lastX, lastY);
    checkCoverage();
    if (!touched){
      touched = true;
      hint.classList.add('hide');
      stopGuideAnimation();
    }
  }, { passive: true });

  window.addEventListener('pointermove', e => {
    if (!drawing || revealed) return;
    eraseLine(lastX, lastY, e.clientX, e.clientY);
    lastX = e.clientX; lastY = e.clientY;
  }, { passive: true });

  const stopDraw = () => { drawing = false; };
  window.addEventListener('pointerup', stopDraw, { passive: true });
  window.addEventListener('pointercancel', stopDraw, { passive: true });
  window.addEventListener('pointerleave', stopDraw, { passive: true });

  /* ============================================================
     TRÁI TIM LỚN
     ============================================================ */
  const PALETTE = [
    '#ff2d55','#ff3b30','#ff5e7a','#ff7aa2','#ff9ff3',
    '#e84393','#d63031','#ff6b81','#ff8c42','#ffb703',
    '#ffd166','#f9c74f','#b8e994','#2ed573','#1dd1a1',
    '#48dbfb','#1e90ff','#4facfe','#a29bfe','#8e44ad',
    '#e056fd','#f368e0','#ffffff','#ffe0ef','#ff4757'
  ];

  const SVG_PATH = 'M50 83.75C41 72.5 5 52.25 5 34.25C5 11.75 34.25 5 50 29.75'
                 + 'C65.75 5 95 11.75 95 34.25C95 52.25 59 72.5 50 83.75Z';

  function heartPoint(t, s){
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x: x * s, y: -y * s };
  }

  function buildHeartField(){
    field.innerHTML = '';

    const s = Math.min(W, H) * 0.0128;
    const RINGS = 9;
    const pts = [];

    for (let ri = 1; ri <= RINGS; ri++){
      const r = ri / RINGS;
      const count = Math.round(8 + r * 27);
      for (let i = 0; i < count; i++){
        const t = (i / count) * Math.PI * 2 + ri * 0.42;
        const p = heartPoint(t, r);
        pts.push({ x: p.x * s, y: (p.y - 2.5) * s });
      }
    }

    pts.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'heart';

      const size = s * 1.05 + Math.random() * s * 0.62;
      const rot  = (Math.random() - 0.5) * 52;
      const col  = PALETTE[(Math.random() * PALETTE.length) | 0];

      el.style.left   = `calc(50% + ${p.x}px)`;
      el.style.top    = `calc(50% + ${p.y}px)`;
      el.style.width  = size + 'px';
      el.style.height = size + 'px';
      el.style.transform = `translate(-50%,-50%) rotate(${rot}deg) scale(1)`;
      el.dataset.rot = rot;

      el.innerHTML =
        `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
           <path d="${SVG_PATH}" fill="${col}"/>
         </svg>`;

      field.appendChild(el);

      el.animate(
        [
          { transform: `translate(-50%,-50%) rotate(${rot}deg) scale(0)` },
          { transform: `translate(-50%,-50%) rotate(${rot}deg) scale(1.22)`, offset: 0.68 },
          { transform: `translate(-50%,-50%) rotate(${rot}deg) scale(1)` }
        ],
        {
          duration: 640,
          delay: i * 4.6,
          easing: 'cubic-bezier(.2,1.35,.4,1)',
          fill: 'backwards'
        }
      );
    });
  }

  function explodeHearts(){
    const items = Array.from(field.children);
    items.forEach(el => {
      const rot  = parseFloat(el.dataset.rot) || 0;
      const ang  = Math.random() * Math.PI * 2;
      const dist = 260 + Math.random() * 620;
      const dx   = Math.cos(ang) * dist;
      const dy   = Math.sin(ang) * dist - 110;
      const spin = (Math.random() - 0.5) * 780;

      el.animate(
        [
          { transform: `translate(-50%,-50%) rotate(${rot}deg) scale(1)`, opacity: 1 },
          { transform: `translate(calc(-50% + ${dx * 0.34}px), calc(-50% + ${dy * 0.34}px)) rotate(${rot + spin * 0.4}deg) scale(1.18)`,
            opacity: 1, offset: 0.28 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${rot + spin}deg) scale(.32)`,
            opacity: 0 }
        ],
        {
          duration: 1050 + Math.random() * 550,
          easing: 'cubic-bezier(.15,.72,.28,1)',
          fill: 'forwards'
        }
      );
    });
  }

  /* ============================================================
     MƯA TIM
     ============================================================ */
  const DROP_COLORS = ['#ff2d75','#ff4d88','#ff6fa5','#ff8fb9','#ffa8c8','#ff5c96','#e91e63'];
  const drops = [];
  const MAX_DROPS = 78;

  function newDrop(anywhere){
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : -50 - Math.random() * 120,
      vy: 70 + Math.random() * 175,
      size: 9 + Math.random() * 19,
      rot: (Math.random() - 0.5) * 1.1,
      vr: (Math.random() - 0.5) * 1.6,
      sway: 12 + Math.random() * 30,
      phase: Math.random() * 6.2832,
      alpha: 0.55 + Math.random() * 0.45,
      color: DROP_COLORS[(Math.random() * DROP_COLORS.length) | 0]
    };
  }

  function drawHeart2D(ctx, x, y, size, rot, color, alpha){
    const u = size / 100;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(u, u);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(50, 83.75);
    ctx.bezierCurveTo(41, 72.5,  5, 52.25,  5, 34.25);
    ctx.bezierCurveTo( 5, 11.75, 34.25, 5, 50, 29.75);
    ctx.bezierCurveTo(65.75, 5,  95, 11.75, 95, 34.25);
    ctx.bezierCurveTo(95, 52.25, 59, 72.5,  50, 83.75);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  let rainOn = false;
  let lastT = 0;

  function rainLoop(now){
    if (!rainOn) return;
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;

    if (drops.length < MAX_DROPS && Math.random() < 0.85){
      drops.push(newDrop(false));
    }

    rctx.clearRect(0, 0, W, H);

    for (let i = drops.length - 1; i >= 0; i--){
      const d = drops[i];
      d.y += d.vy * dt;
      d.x += Math.sin(d.phase + d.y * 0.012) * d.sway * dt;
      d.rot += d.vr * dt;
      if (d.y > H + 70){ drops.splice(i, 1); continue; }
      drawHeart2D(rctx, d.x, d.y, d.size, d.rot, d.color, d.alpha);
    }

    requestAnimationFrame(rainLoop);
  }

  function startRain(){
    if (rainOn) return;
    rainOn = true;
    for (let i = 0; i < 34; i++) drops.push(newDrop(true));
    lastT = performance.now();
    requestAnimationFrame(rainLoop);
  }

  /* ============================================================
     VÒNG ẢNH
     ============================================================ */

  const FALLBACK = (i) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">'
    + '<defs><linearGradient id="g' + i + '" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="hsl(' + ((i*57)%360) + ',78%,78%)"/>'
    + '<stop offset="1" stop-color="hsl(' + ((i*57+40)%360) + ',72%,58%)"/>'
    + '</linearGradient></defs>'
    + '<rect width="200" height="200" fill="url(#g' + i + ')"/>'
    + '<text x="100" y="112" text-anchor="middle" fill="#ffffff" '
    + 'font-family="sans-serif" font-size="26" font-weight="700">Ảnh ' + (i+1) + '</text>'
    + '</svg>'
  );

  function buildPhotoStack(){
    photoRing.innerHTML = '';

    const N = PHOTOS.length;

    PHOTOS.forEach((src, i) => {
      const slot = document.createElement('div');
      slot.className = 'photo-slot';
      slot.style.zIndex = i + 1;

      const el = document.createElement('div');
      el.className = 'photo';
      el.style.opacity = '0';
      el.style.transform = 'translate(-50%,-50%) scale(0)';

      const img = document.createElement('img');
      img.alt = '';
      img.addEventListener('error', function onerr(){
        img.removeEventListener('error', onerr);
        img.src = FALLBACK(i);
      });
      img.src = src;
      el.appendChild(img);
      slot.appendChild(el);
      photoRing.appendChild(slot);

      const dx  = (Math.random() - 0.5) * 80;
      const dy  = (Math.random() - 0.5) * 80;
      const rot = (Math.random() - 0.5) * 30;

      setTimeout(() => {
        el.style.transition =
          'transform .75s cubic-bezier(.2,1.35,.4,1), opacity .45s ease';
        el.style.opacity = '1';
        el.style.transform =
          `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${rot}deg) scale(1)`;
      }, i * PHOTO_DELAY);
    });

    return (N - 1) * PHOTO_DELAY + 850;
  }

  function slamPhotos(){
    const photos = photoRing.querySelectorAll('.photo');
    
    photos.forEach((photo, i) => {
      setTimeout(() => {
        photo.animate([
          { transform: photo.style.transform, opacity: 1 },
          { transform: 'translate(-50%, -50%) scale(7) rotate(15deg)', opacity: 0 }
        ], {
          duration: 500,
          easing: 'cubic-bezier(0.4, 0, 1, 1)',
          fill: 'forwards'
        });
      }, i * 450);
    });

    setTimeout(showCard, photos.length * 450 + 200);
  }

  function showCard() {
    document.getElementById('bouquet').classList.add('show');
    greet.classList.add('on');
  }

  function beginPhotoShow(){
    const stackTime = buildPhotoStack();

    setTimeout(() => {
      slamPhotos();
    }, stackTime + 500); 
  }

  /* ============================================================
     REVEAL
     ============================================================ */
  let revealedOnce = false;

  function reveal(){
    if (revealedOnce) return;
    revealedOnce = true;
    revealed = true;

    hint.classList.add('hide');
    hideGuide();
    fog.classList.add('gone');
    setTimeout(() => { fog.style.display = 'none'; }, 950);

    stage.classList.add('on');
    buildHeartField();

    const totalPop = 200 * 4.6 + 640;

    setTimeout(explodeHearts, totalPop + 520);
    setTimeout(startRain,     totalPop + 380);
    setTimeout(beginPhotoShow, totalPop + 1500);
  }

  /* ============================================================
     RESIZE
     ============================================================ */
  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;

    [fog, rain].forEach(c => {
      c.width  = Math.floor(W * dpr);
      c.height = Math.floor(H * dpr);
      c.style.width  = W + 'px';
      c.style.height = H + 'px';
    });

    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (!revealed){
      paintFog();
      if (guideSvg.classList.contains('on')){
        requestAnimationFrame(() => {
          requestAnimationFrame(buildGuideSamples);
        });
      }
    }
  }

  let rt = null;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(resize, 180);
  });

  resize();

  requestAnimationFrame(() => {
    setTimeout(startGuide, 300);
  });

})();
</script>
</body>
</html>
